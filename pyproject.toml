[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "halftone-stencil-stamp-maker"
version = "0.4.0"
description = "Stencils y sellos CMYK por trama de medios tonos, listos para imprimir en 3D"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "pillow", "shapely>=2", "trimesh", "mapbox-earcut", "manifold3d"]

[project.scripts]
hsm = "hsm.cli:main"

[tool.setuptools]
packages = ["hsm"]
